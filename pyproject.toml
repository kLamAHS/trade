[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractional-trading-bot"
version = "0.1.0"
description = "Fractional-memory systematic trading bot with an Alpaca paper-trading front end and an internal execution simulator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "alpaca-py>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-timeout>=2.2"]
plots = ["matplotlib>=3.8"]

[project.scripts]
trading-bot = "trading_bot.main:main"

[tool.setuptools.packages.find]
include = ["trading_bot*"]

[tool.setuptools.package-data]
trading_bot = ["config/*.yaml", "gui/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["trading_bot/tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::statsmodels.tools.sm_exceptions.InterpolationWarning",
]
