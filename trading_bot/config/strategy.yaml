# ---------------------------------------------------------------------------
# Fractional-Memory Systematic Trading Bot -- central strategy configuration.
#
# Every strategy constant lives here (spec section 62).  The file is loaded once
# into an immutable configuration object; application code never hard-codes a
# strategy parameter.
# ---------------------------------------------------------------------------

seed: 42

market:
  instrument: SPY
  bar_minutes: 30
  timezone: America/New_York
  session_open: "09:30"        # regular session open (exchange local time)
  session_close: "16:00"       # regular session close (exchange local time)
  early_close_time: "13:00"    # half-day close
  nyse_early_close_rules: true # day after Thanksgiving, 3 July / 24 December when Mon-Thu
  early_closes: []             # extra half-day dates, ISO format, e.g. ["2026-11-27"]
  nyse_holiday_rules: true     # rule-based NYSE full-day closures (used to detect missing sessions)
  holidays: []                 # extra closures, ISO format, e.g. ["2025-01-09"]
  bars_per_day: 13             # 390 session minutes / 30-minute bars
  trading_days_per_year: 252

data:
  # Data-quality circuit breakers (spec section 35).
  max_abs_log_jump: 0.10       # |log(C_t / C_{t-1})| above this is an "extreme unvalidated jump"
  stale_feed_bars: 2           # live mode: no bar for this many bar intervals during session -> stale
  halt_recovery_bars: 13       # consecutive clean bars required to leave DATA_HALTED
  volume_enabled: true         # set false to disable the volume module globally (never fill silently)

fractional:
  fixed_orders: [0.25, 0.50, 0.75]
  volatility_order: 0.40
  adaptive_min: 0.05
  adaptive_max: 0.95
  adaptive_step: 0.05
  weight_threshold: 0.00001
  weight_threshold_run: 10     # consecutive negligible weights required to stop generation
  max_lags: 500
  adf_pvalue_max: 0.05
  kpss_pvalue_min: 0.05
  adf_maxlag: 20               # cap on ADF augmentation lags (autolag=AIC below the cap)
  min_observations: 50         # transformed observations required before a candidate d is testable

features:
  # ---- optional feature families (market-state spec sections 8-31).  Every family must earn its place
  # through the research ablation matrix; all are off by default except FRACTIONAL.  Nothing is ever
  # approximated from missing data: a family whose inputs are absent is reported as unavailable.
  fractional:
    enabled: true
  regime:                      # causal Gaussian HMM (filtered probabilities only; smoothing is never a feature)
    enabled: false
    states: 3
    causal_filter_only: true
  ofi:                         # order-flow imbalance from bar-close NBBO snapshots with displayed sizes (Tier B)
    enabled: false
    normalization: displayed_depth
  kalman:                      # local-linear-trend filter (level + velocity), parameters fitted per training block
    enabled: false
    subset: full               # full | latent_price | innovation (ablation, section 27)
  cross_asset:                 # correlated instruments joined strictly as-of the decision time
    enabled: false
    symbols: []                # e.g. [QQQ, IWM]
    max_staleness_seconds: 1800
  vpin:                        # experimental flow toxicity (bulk volume classification); disabled unless confident
    enabled: false
    bucket_bars: 5
    n_buckets: 50
    min_classification_confidence: 0.15
  robust_z_window: 250         # N for rolling median / MAD (spec section 9)
  volume_z_window: 50          # N for the volume robust z-score (spec section 16)
  ewma_lambda: 0.94            # exponentially smoothed realized variance (spec section 8)
  ewma_window: 450             # finite EWMA kernel length (lambda^450 ~ 1e-12): identical batch & streaming values
  epsilon: 1.0e-12
  vol_windows: [10, 50, 200]
  return_lags: [1, 2, 4, 8, 16]
  trend_window: 50
  vol_regime_short: 20
  vol_regime_long: 200
  frac_regime_floor: 0.1
  slope_lags: [1, 4]
  use_raw_fractional_levels: false   # raw D^d p levels are recorded but only z-scored levels feed the models

market_representation:
  # Which bars the strategy sees (market-state spec section 6).  Event bars are built from the feed's time
  # bars; features then carry duration_seconds and per-unit-time normalisations.  market.bars_per_day is
  # replaced by the empirical bars per session for event bars.
  bar_type: time               # time | volume | dollar | tick
  target_minutes: 30
  target_shares: 500000        # volume bars
  target_dollar_volume: 250000000   # dollar bars
  target_ticks: 20             # tick bars (fine bars per bar when built from a bar feed)
  candidates: []               # research mode (section 7): e.g. [time_30m, volume_500k, dollar_250m]; selected inside training only

prediction:
  horizon_bars: 4              # H bars
  label_price: open            # open: Y = log O_{t+1+H} - log O_{t+1} (executable); close: spec-literal close-to-close
  volatility_window: 50        # sigma_{t,50} used for label and edge normalization

models:
  regression:
    backend: lightgbm          # lightgbm | sklearn (HistGradientBoosting fallback)
    objective: regression      # squared error
    max_depth: 3
    learning_rate: 0.03
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1             # L1
    reg_lambda: 1.0            # L2
    num_threads: 2
  direction:
    C: 0.5                     # inverse L2 strength for the logistic direction model
    max_iter: 1000
  calibration:
    method: isotonic           # isotonic | binned
    bins: 20
    min_points: 10             # below this the calibrator degrades to a least-squares slope through the origin

training:
  window_bars: 10000
  minimum_bars: 3000
  retrain_every_bars: 250
  walk_forward_folds: 5
  first_train_fraction: 0.40   # fold 1 trains on the earliest 40% and validates the next 10%; fold k adds 10% (spec 38)
  fold_validation_fraction: 0.10
  purge_bars: 5                # H + 1
  embargo_bars: 5
  inner_calibration_fraction: 0.25   # tail of the first fold's training block used for its chronological calibration
  inner_calibration_min_rows: [50, 20]   # minimum [fit, calibration] rows for the inner split
  min_dataset_rows: 200        # minimum valid (feature, label) rows for a training cycle
  outer_holdout_fraction: 0.15 # newest rows never used for selection; acceptance and the ablation score are read there (0 disables)
  fold_local_d: true           # estimate d* per fold from that fold's training block only (false: whole-window d* everywhere)
  fold_local_components: true  # fit HMM / Kalman / VPIN parameters per fold from its training block only
  panel:                       # pooled training rows from other instruments (the bot still trades one symbol)
    # One instrument gives one experiment.  Panel symbols add rows to every model *fit* only: folds, the
    # outer holdout, the acceptance criteria and the simulated P&L stay on the traded instrument, so what
    # is accepted is still a statement about it.  The label is already scale free (returns in units of the
    # symbol's own volatility); level-dependent features are mapped onto the primary's training
    # distribution so a tree cannot split on "which symbol is this".
    enabled: false
    symbols: []                # e.g. [QQQ, IWM, DIA, MDY]
    align_features: true       # map each panel symbol's feature distribution onto the primary's
    max_symbols: 20
    max_rows_per_fit: 0        # 0 = no cap; otherwise thin the pooled rows deterministically
  # Fixed, small hyperparameter search space (spec section 41).  The identical
  # candidates are evaluated on every retraining cycle.
  hyperparameter_grid:
    n_estimators: [150, 300, 600]
    min_child_samples: [50, 200]
  score:
    turnover_weight: 0.25
    drawdown_weight: 0.25
    drawdown_reference: 0.10   # drawdown penalty = max_drawdown / reference
  acceptance:
    min_accuracy: 0.51
    min_correlation: 0.0
    min_net_pnl: 0.0
    min_profit_factor: 1.05
    max_drawdown: 0.15
    min_folds_beating_baseline: 3
    require_holdout_edge: true # S_F - S_0 on the untouched holdout must be positive for promotion
  ablation:
    consecutive_failures_to_halt: 3

signal:
  cost_multiplier: 3.0         # trade only when |ER| > 3 * Cost
  confidence_cost_multiplier: 6.0
  rebalance_threshold: 0.15
  reevaluate_every_bars: 1     # 1 = re-target every bar (spec 30/31); set to prediction.horizon_bars to hold each entry to the forecast horizon
  vol_reference_days: 30       # sigma_ref = median sigma_50 over trailing 30 sessions
  vol_multiplier_min: 0.25
  vol_multiplier_max: 1.5

risk:
  regime_adjustment:           # market-state spec section 11: regime state modifies sizing, never the algorithm
    enabled: false
    stress_probability_threshold: 0.70
    exposure_multiplier: 0.40  # max exposure x this when P(stress) exceeds the threshold
    edge_multiplier: 1.5       # required net edge x this
    confidence_multiplier: 1.0
  max_absolute_exposure: 1.0
  maximum_holding_bars: 12
  stop_sigma_multiple: 4.0
  daily_loss_limit: 0.025
  drawdown_halt: 0.10

execution:
  # ---- decision policy (market-state spec section 3): trade only when the expected gross return survives
  # spread + slippage + adverse selection + fees + an uncertainty buffer by at least minimum_net_edge_bps.
  decision_policy: net_edge    # net_edge | legacy (|ER| > signal.cost_multiplier x round-trip cost)
  minimum_net_edge_bps: 8
  uncertainty_buffer_bps: 3
  uncertainty_z: 0.0           # extra buffer = z x the adverse-selection model's residual std (0 disables)
  fee_bps: 0.0                 # regulatory / venue fees not in the cost model (round trip)
  adverse_selection_model: true      # ridge model of the post-fill adverse move beyond the forecast (fitted on OOF rows)
  adverse_selection_floor_bps: 0.0   # the execution model can add cost, never edge
  adverse_selection_ridge_alpha: 1.0
  commission_per_side: 0.0     # relative (fraction of notional); Alpaca equities are commission free
  default_spread: 0.0001       # relative full spread used when bid/ask are unavailable
  slippage_range_fraction: 0.05
  slippage_reference: execution_bar   # execution_bar | signal_bar
  live_fill_source: quote      # paper mode when the next open predates the decision: quote (NBBO at decision) | broker (actual Alpaca fill)
  min_order_notional: 1.0

portfolio:
  initial_capital: 100000.0

diagnostics:
  vol_regime_edges: [0.8, 1.2]     # attribution buckets on volatility_state (sigma_20 / sigma_200)
  oos_by_d_every_retrain: false    # maintain the d -> OOSScore(d) curve on every retrain (expensive)
  oos_by_d_step: 3                 # evaluate every k-th candidate d for that curve

research:
  # Research-grade validation framework (docs/VALIDATION_FRAMEWORK.md).  Nothing here changes live behaviour.
  walkforward:
    train_bars: null           # null -> training.window_bars (trailing training block per window)
    first_train_bars: null     # null -> training.minimum_bars (the first window trains as soon as the bot would)
    oos_bars: null             # null -> training.retrain_every_bars (one OOS block per retrain)
    step_bars: null            # null -> oos_bars (rolling, non-overlapping OOS blocks)
    expanding: false           # true: every window trains on all history before it
    deploy_policy: always      # always: trade every refit (research); production: trade only accepted models, keep the previous otherwise
  holdout:
    fraction: 0.15             # locked final holdout: never touched by development runs, opened only with --open-holdout
  simulation:
    portfolio_halts: true      # apply risk.daily_loss_limit / risk.drawdown_halt in the OOS simulation
  cost:
    flat_bps_levels: [0, 1, 2, 5, 10]
    model_cost_scales: [1.0, 2.0, 3.0]
  timing:
    delays: [0, 1, 2]          # extra bars of execution latency
  stress:
    d_steps: [-2, -1, 0, 1, 2] # adaptive-order perturbation in units of fractional.adaptive_step (light refit)
    collapse_fraction: 0.75    # a perturbation "collapses" when Sharpe loses this fraction and the return turns non-positive
  sanity:
    target_shift_bars: 20      # leakage test: label moved this many bars into the future
    random_permutations: 20
    max_destroyed_sharpe: 1.0  # a destroyed signal must stay below this Sharpe
  bootstrap:
    block_bars: 65             # 5 sessions
    n_boot: 1000
    monte_carlo_paths: 2000
    seed: 0
  baselines:
    vol_target: 0.10
    momentum_bars: 65
    random_permutations: 20
  regimes:
    short_bars: 20
    long_bars: 200
  reproducibility:
    windows: 1                 # windows retrained a second time and compared bit for bit (--repro-full re-runs everything)
  multiple_testing:
    prior_trials: 0            # strategy variants tried before this configuration (declared honestly by the researcher)
  synthetic:
    seeds: 5
    n_bars: 4000
    master_seed: 0
  families:                    # feature-family ablation matrix, sabotage failure tests and gates (market-state spec 32-47)
    n_boot: 1000               # bootstrap draws for the per-window delta-Sharpe CI of each family
    sabotage_seeds: 3          # stochastic sabotages (shuffle / random) are averaged over this many draws
    gates:
      min_median_delta_sharpe: 0.0   # marginal contribution (Full vs Full-F) median across windows
      min_positive_fraction: 0.55    # windows in which the family helps
      max_dominance: 0.5             # share of the total delta-Sharpe a single window may carry
  gates:                       # promotion thresholds (research spec section 30)
    min_windows: 20
    min_trades: 200
    min_sharpe: 1.0
    max_drawdown: 0.25
    min_profit_factor: 1.2
    min_positive_window_fraction: 0.55
    min_median_delta_sharpe: 0.0
    min_positive_delta_fraction: 0.5
    require_profitable_at_2x_cost: true
    require_viable_at_plus_1_bar: true
    allow_perturbation_collapse: false
    min_bootstrap_sharpe_lower: 0.0
    require_sanity_pass: true
    require_leakage_pass: true
    holdout_min_return: 0.0
    holdout_min_sharpe: 0.0
    require_reproducible: true

paths:
  artifacts_dir: artifacts
  models_dir: artifacts/models
  audit_dir: artifacts/audit
  data_dir: artifacts/data
  diagnostics_dir: artifacts/diagnostics

alpaca:
  paper: true                  # must stay true: live trading is not supported by this application
  feed: iex
  adjustment: split            # split | raw | dividend | all  (dividend adjustment uses post-bar information)
  history_days: 1200
  poll_seconds: 15
  mirror_orders: true          # submit mirrored whole-share market orders to the Alpaca paper account
