name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Unit, numerical, leakage, execution, risk and end-to-end tests
        run: pytest -q -p no:warnings
      - name: Smoke backtest through the CLI (must promote a model and write an artifact)
        run: |
          python -m trading_bot.main backtest --synthetic 2000 --seed 21 --fast --symbol SYN --quiet --require-model \
            --set training.minimum_bars=1400 --set training.window_bars=1600 \
            --set training.acceptance.min_accuracy=0 --set training.acceptance.min_correlation=-1 \
            --set training.acceptance.min_net_pnl=-1 --set training.acceptance.min_profit_factor=0 \
            --set training.acceptance.max_drawdown=1 --set training.acceptance.min_folds_beating_baseline=0 \
            --set training.acceptance.require_holdout_edge=false --artifacts /tmp/ci-artifacts
          test -f /tmp/ci-artifacts/models/current.json
          python - <<'PY'
          import glob, json
          meta = json.load(open(sorted(glob.glob("/tmp/ci-artifacts/models/model_*/metadata.json"))[-1]))
          assert meta["environment"]["packages"]["lightgbm"], meta["environment"]
          assert meta["validation_metrics"]["holdout_rows"] > 0
          print("artifact ok:", meta["model_id"], meta["environment"]["git_commit"][:12])
          PY
      - name: Research pipeline smoke run (synthetic, quick stages, must be reproducible and leak-free)
        run: |
          python -m trading_bot.main research --synthetic 2600 --seed 21 --memory-d 0.45 --amplitude 6 --symbol SYN --fast \
            --stages quick --quiet --set training.window_bars=1600 --set training.minimum_bars=1400 \
            --set training.hyperparameter_grid.n_estimators=[40] --set models.regression.num_threads=2 \
            --set research.bootstrap.n_boot=100 --set research.bootstrap.monte_carlo_paths=100 \
            --set research.baselines.random_permutations=3 --artifacts /tmp/ci-research
          python - <<'PY'
          import glob, json
          s = json.load(open(sorted(glob.glob("/tmp/ci-research/runs/syn_*/summary.json"))[-1]))
          assert s["reproducibility"]["status"] == "IDENTICAL", s["reproducibility"]
          assert s["leakage"]["passed"] and s["development"]["timestamp_audit"]["violations"] == 0
          assert s["gates"]["classification"] == "EXPERIMENTAL (SYNTHETIC)"
          print("research run ok:", s["run_id"], s["development"]["n_windows"], "windows")
          PY
      - name: Market-state smoke run (hostile synthetic market, feature families, execution stress, family gates)
        run: |
          python -m trading_bot.main research --synthetic 2600 --seed 21 --hostile --memory-d 0.45 --amplitude 6 --symbol SYN --fast \
            --stages walkforward,execution_stress,families,leakage,gates --quiet \
            --set training.window_bars=1600 --set training.minimum_bars=1400 \
            --set training.hyperparameter_grid.n_estimators=[40] --set models.regression.num_threads=2 \
            --set features.regime.enabled=true --set features.ofi.enabled=true --set features.kalman.enabled=true \
            --set features.cross_asset.enabled=true --set features.cross_asset.symbols=[QQQ] \
            --set research.bootstrap.n_boot=100 --set research.families.n_boot=100 --artifacts /tmp/ci-market-state
          python - <<'PY'
          import glob, json
          s = json.load(open(sorted(glob.glob("/tmp/ci-market-state/runs/syn_*/summary.json"))[-1]))
          fam, es = s["families"], s["execution_stress"]
          assert set(fam["present"]) >= {"FRACTIONAL", "REGIME", "OFI", "KALMAN", "CROSS_ASSET"}, fam["present"]
          assert all(v in ("ACCEPTED", "REJECTED", "RESEARCH ONLY") for v in fam["verdict"].values()), fam["verdict"]
          assert all(r["signals_equal_reference"] for r in es["frozen"]), es["frozen"]
          assert s["leakage"]["passed"] and s["development"]["timestamp_audit"]["violations"] == 0
          print("market-state run ok:", s["run_id"], fam["verdict"], "frozen break-even", es["frozen_breakeven_multiplier"])
          PY
